<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Find</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search every card, journal entry, document section, claim and file in the burning-house repository, with links between them.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Layout: no page scroll. Search and filters on top; results and the opened item each scroll inside their own pane (stacked on a phone, side by side on a desk). */
:root{--bg:#fdf8f2;--surface:#f6efe5;--elev:#ede4d6;--ink:#131311;--body:#28241f;--muted:#6b6156;--line:#e0d5c4;--acc:#a85f08;--bad:#a3321f;--ok:#3f6b4a;--mark:#ffe08a;
 --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130f;--surface:#1f1b16;--elev:#2a251e;--ink:#f1e9dc;--body:#ddd3c3;--muted:#a3978a;--line:#39322a;--acc:#e8a244;--bad:#ec7a63;--ok:#8fc49c;--mark:#6b5200;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16130f;--surface:#1f1b16;--elev:#2a251e;--ink:#f1e9dc;--body:#ddd3c3;--muted:#a3978a;--line:#39322a;--acc:#e8a244;--bad:#ec7a63;--ok:#8fc49c;--mark:#6b5200;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--body);font:16px/1.5 var(--serif);display:grid;grid-template-rows:auto minmax(0,1fr)}
header{padding:10px 16px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
h1{font:600 22px/1 var(--serif);color:var(--ink);margin:0}
.links{font:12px var(--mono);margin-left:auto;display:flex;gap:12px}.links a{color:var(--muted)}
#q{flex:1 1 220px;font:17px var(--serif);padding:8px 10px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);min-width:0}
#q:focus-visible,button:focus-visible,a:focus-visible,.res:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:500 11.5px var(--mono);color:var(--ink);background:transparent;border:1px solid var(--muted);padding:5px 9px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button span{color:inherit;opacity:.65;margin-left:5px}
main{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr);min-height:0}
#list{overflow:auto;border-bottom:1px solid var(--line)}
#detail{overflow:auto;padding:14px 16px 40px;background:var(--surface)}
.res{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 16px;cursor:pointer;color:inherit;font:inherit}
.res[aria-current="true"]{background:var(--elev)}
.res .k{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-right:8px}
.res b{font:600 16px/1.25 var(--serif);color:var(--ink)}
.res p{margin:2px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;padding:0 1px}
#count{font:12px var(--mono);color:var(--muted)}
#detail h2{font:600 24px/1.15 var(--serif);color:var(--ink);margin:2px 0 6px;text-wrap:balance;max-width:30em}
#detail .meta{font:12px/1.5 var(--mono);color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
#detail h3{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 3px}
#detail p{margin:0 0 8px;max-width:38em;white-space:pre-wrap}
#detail a{color:var(--acc)}
.pill{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);padding:1px 6px;color:var(--ink);white-space:nowrap}
.pill.unsupported,.pill.conflicting{border-color:var(--bad);color:var(--bad)}.pill.open{border-style:dashed}
.pill.supported,.pill.measured,.pill.resolved{border-color:var(--ok);color:var(--ok)}
ul.refs{margin:0;padding-left:18px}ul.refs li{margin-bottom:3px;font-size:15px}
.open-a{display:inline-block;font:500 12px var(--mono);border:1.5px solid var(--ink);color:var(--ink)!important;text-decoration:none;padding:5px 9px;margin:4px 0 6px}
@media (min-width:880px){main{grid-template-rows:none;grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}#list{border-bottom:0;border-right:1px solid var(--line)}#detail{padding:20px 26px 60px}}
</style></head><body>
<header>
 <div class="row"><h1>Find</h1><span id="count"></span><div class="links"><a href="./">Home</a><a href="docs/index.html">Reading Room</a><a href="read.html">Read the paper</a><a href="paeleo/abominable-house/index.html">PAE-04</a><a href="vtx01_build/viewer/index.html">VTX-0.1</a></div></div>
 <div class="row"><input id="q" type="search" placeholder="Search cards, entries, sections, claims, files" aria-label="Search" autocomplete="off"></div>
 <div class="chips" id="chips" role="group" aria-label="Kind"></div>
</header>
<main><div id="list" role="listbox" aria-label="Results"></div><div id="detail" aria-live="polite"></div></main>
<script src="data/index.js"></script>
<script>
const X=window.BH_INDEX,$=id=>document.getElementById(id);
const KINDS=[['all','All'],['claims','Claims'],['cards','Cards'],['journal','Journal'],['paper','Paper and notes'],['files','Files']];
const ORDER=['unsupported','conflicting','open','supported','measured','resolved'];
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
// one flat list of items: kind, title, text to search, and a function that draws the detail
const ITEMS=[];
X.claims.slice().sort((a,b)=>ORDER.indexOf(a.status)-ORDER.indexOf(b.status)||a.id.localeCompare(b.id)).forEach(c=>ITEMS.push({k:'claims',tag:c.status,title:c.claim,sub:c.where,text:[c.id,c.claim,c.where,c.status,c.evidence,c.next].join(' '),d:c}));
X.cards.forEach(c=>ITEMS.push({k:'cards',tag:c.short+(c.variant?' v'+c.variant:''),title:c.title,sub:c.id,text:[c.id,c.title,...Object.values(c.fields)].join(' '),d:c}));
X.entries.forEach(e=>ITEMS.push({k:'journal',tag:String(e.n).padStart(2,'0'),title:e.title,sub:e.kept,text:[e.title,e.when,e.text,e.kept,e.source,e.unchecked,e.exhibit].join(' '),d:e}));
X.sections.forEach(s=>ITEMS.push({k:'paper',tag:s.role,title:s.heading,sub:s.docname,text:[s.heading,s.docname,s.text].join(' '),d:s}));
X.files.forEach(f=>ITEMS.push({k:'files',tag:f.kind,title:f.path,sub:kb(f.size),text:f.path+' '+f.kind,d:f}));
ITEMS.forEach(i=>{i.lc=i.text.toLowerCase();i.tl=i.title.toLowerCase()});
let kind='all',cur=null,shown=[];
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function hl(node,text,terms){if(!terms.length){node.textContent=text;return}const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');let last=0,m;
 while((m=re.exec(text))){node.append(text.slice(last,m.index));const k=el('mark','',m[0]);node.append(k);last=m.index+m[0].length;if(m[0].length===0)re.lastIndex++}node.append(text.slice(last))}
function snippet(i,terms){if(!terms.length)return i.sub||'';const p=i.lc.indexOf(terms[0]);if(p<0)return i.sub||'';const a=Math.max(0,p-70);return (a?'… ':'')+i.text.slice(a,a+220)}
function search(){const terms=$('q').value.toLowerCase().split(/\s+/).filter(t=>t.length>1);
 let r=ITEMS.filter(i=>(kind==='all'||i.k===kind)&&terms.every(t=>i.lc.includes(t)));
 if(terms.length)r=r.map(i=>[terms.reduce((s,t)=>s+(i.tl.includes(t)?6:0)+Math.min(5,i.lc.split(t).length-1),i.k==='files'?-2:0),i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
 else if(kind==='all')r=r.filter(i=>i.k==='claims'||i.k==='journal');
 shown=r.slice(0,300);const L=$('list');L.textContent='';
 shown.forEach((i,n)=>{const b=el('button','res');b.setAttribute('role','option');b.append(el('span','k',i.k==='claims'?i.tag:i.k==='files'?i.tag:(i.k==='paper'?i.d.docname:i.k)+' '+(i.k==='paper'?'':i.tag)));const t=el('b');hl(t,i.title,terms);b.append(t);const p=el('p');hl(p,snippet(i,terms),terms);b.append(p);b.onclick=()=>open(i);if(i===cur)b.setAttribute('aria-current','true');L.append(b)});
 $('count').textContent=r.length+(r.length>300?' (first 300 shown)':'')+' of '+ITEMS.length+(terms.length||kind!=='all'?'':' · showing claims and journal; type to search everything');
 if(!cur||!shown.includes(cur))open(shown[0]||null,true)}
function sec(D,h,t){if(!t)return;D.append(el('h3','',h));D.append(el('p','',t))}
function link(D,href,label){const a=el('a','open-a',label);a.href=href;D.append(a)}
function open(i,quiet){cur=i;const D=$('detail');D.textContent='';document.querySelectorAll('.res').forEach((b,n)=>b.setAttribute('aria-current',shown[n]===i));if(!i){D.append(el('p','','Nothing matches.'));return}const d=i.d;
 if(i.k==='claims'){const m=el('p','meta');m.append(el('span','pill '+d.status,d.status),'  '+d.id+' · '+d.where);D.append(m);D.append(el('h2','',d.claim));link(D,'docs/claims.html','Open styled Claims table');sec(D,'Evidence',d.evidence);sec(D,'What would settle it',d.next)}
 else if(i.k==='cards'){D.append(el('p','meta',d.id+(d.variant?' · variant '+d.variant+' of 2':'')+' · '+d.words+' words'));D.append(el('h2','',d.title));if(d.href)link(D,d.href,'Open in styled Zettelkasten edition');
  D.append(el('h3','','Used in'));if(d.refs.length){const u=el('ul','refs');d.refs.forEach(r=>{const li=el('li'),a=el('a','',r.label);a.href=r.href;li.append(a);u.append(li)});D.append(u)}else D.append(el('p','','No journal entry or document section cites this card yet.'));
  for(const[k,v]of Object.entries(d.fields))sec(D,k.toLowerCase(),v)}
 else if(i.k==='journal'){D.append(el('p','meta','Journal entry '+d.n+' · '+d.when));D.append(el('h2','',d.title));link(D,d.href,'Open the entry with its exhibits');sec(D,'Seen',d.text);sec(D,'Line kept',d.kept);sec(D,'Not checked',d.unchecked);sec(D,'How it is known',d.source)}
 else if(i.k==='paper'){D.append(el('p','meta',d.docname+' · '+d.role+' · '+d.doc));D.append(el('h2','',d.heading));link(D,d.href,(d.href.startsWith('read.html')||d.href.startsWith('docs/'))?'Open in the reading edition':'Open the file');sec(D,'Text',d.text)}
 else{D.append(el('p','meta',d.kind+' · '+kb(d.size)));D.append(el('h2','',d.path));link(D,d.path,'Open the file')}
 if(!quiet)D.scrollTop=0}
function setKind(k){kind=KINDS.some(x=>x[0]===k)?k:'all';document.querySelectorAll('#chips button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===kind));cur=null;search();try{history.replaceState(null,'',kind==='all'?location.pathname:'#'+kind)}catch(e){}}
KINDS.forEach(([k,n])=>{const b=el('button','',n);b.dataset.k=k;b.append(el('span','',String(k==='all'?ITEMS.length:ITEMS.filter(i=>i.k===k).length)));b.onclick=()=>setKind(k);$('chips').append(b)});
$('q').addEventListener('input',()=>{cur=null;search()});
addEventListener('hashchange',()=>setKind(location.hash.slice(1)));
setKind(location.hash.slice(1));
</script></body></html>
